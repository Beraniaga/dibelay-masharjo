<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Database Kepegawaian</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
	<script src="https://apis.google.com/js/api.js"></script>
	<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- HEADER -->
	<header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg overflow-hidden shadow-sm">
            <img src="logo.png" alt="Logo Beraniaga" class="w-full h-full object-cover">
            </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight">Database Kepegawaian</h1>
                    <p class="text-[11px] text-slate-500">Umbulharjo 1</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-full text-xs font-semibold text-emerald-700">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                Database Connected
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- COUNTER STATS -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="user-check" class="w-5 h-5"></i></div>
                <div><p class="text-[11px] text-slate-400 font-medium uppercase">Total Pegawai</p><h3 id="stat-total" class="text-xl font-bold text-slate-900 mt-0.5">0</h3></div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div class="p-3 bg-purple-50 text-purple-600 rounded-xl"><i data-lucide="award" class="w-5 h-5"></i></div>
                <div><p class="text-[11px] text-slate-400 font-medium uppercase">Pegawai ASN</p><h3 id="stat-asn" class="text-xl font-bold text-slate-900 mt-0.5">0</h3></div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="briefcase" class="w-5 h-5"></i></div>
                <div><p class="text-[11px] text-slate-400 font-medium uppercase">JLOP / TT</p><h3 id="stat-tt" class="text-xl font-bold text-slate-900 mt-0.5">0</h3></div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center gap-4">
                <div class="p-3 bg-rose-50 text-rose-600 rounded-xl"><i data-lucide="shield-alert" class="w-5 h-5"></i></div>
                <div><p class="text-[11px] text-slate-400 font-medium uppercase">Pihak Ketiga</p><h3 id="stat-p3" class="text-xl font-bold text-slate-900 mt-0.5">0</h3></div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                <input type="text" id="search-input" placeholder="Cari nama, NIP, atau jabatan..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            </div>
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button onclick="filterStatus('ALL')" class="filter-btn active bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">Semua</button>
                <button onclick="filterStatus('ASN')" class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">ASN</button>
                <button onclick="filterStatus('JLOP / TT')" class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">JLOP / TT</button>
                <button onclick="filterStatus('Pihak Ketiga')" class="filter-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">Pihak Ketiga</button>
            </div>
        </div>

        <div id="loading-state" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent mb-2"></div>
            <p class="text-xs text-slate-500 font-medium">Sinkronisasi database spreadsheet...</p>
        </div>

        <div id="employee-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
    </main>

    <!-- MODAL 1: DETAIL PEGAWAI -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-slate-200 overflow-hidden transform scale-95 transition-all">
            <div class="bg-linear-to-r from-blue-600 to-indigo-700 p-6 text-white relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-white/80 hover:text-white bg-white/10 p-1.5 rounded-full cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
                <span id="modal-badge" class="px-2 py-0.5 text-[9px] font-bold uppercase rounded-md bg-white/20 tracking-wider">ASN</span>
                <h3 id="modal-nama" class="text-lg font-bold mt-2">Nama Pegawai</h3>
                <p id="modal-jabatan" class="text-xs text-blue-100 mt-0.5">Jabatan Pegawai</p>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto" id="modal-body-content"></div>
        </div>
    </div>

    <!-- MODAL 2: FORM TAMBAH PELATIHAN -->
    <div id="form-pelatihan-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-sm font-bold text-slate-800">Tambah Riwayat Pelatihan</h3>
                <button onclick="closeFormPelatihan()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="form-pelatihan" onsubmit="submitPelatihan(event)" class="p-5 space-y-3">
                <input type="hidden" id="input-nik" name="NIK">
                
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama Pelatihan / Diklat *</label>
                    <input type="text" id="input-nama-pelatihan" required placeholder="Contoh: Pelatihan Pelayanan Kesehatan" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Tahun *</label>
                        <input type="number" id="input-tahun" required placeholder="2024" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Penyelenggara *</label>
                        <input type="text" id="input-penyelenggara" required placeholder="Dinkes / Kemenkes" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nomor Sertifikat (optional)</label>
                    <input type="text" id="input-no-sertifikat" placeholder="123/SERT/2024" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-4 p-3 bg-blue-50 border border-blue-100 rounded-xl space-y-2">
				    <label class="block text-[11px] font-semibold text-slate-700">Lampiran Sertifikat (Opsional)</label>
				    <div id="drive-picker-status" class="flex items-center justify-between">
				        <span id="file-status-text" class="text-[11px] text-slate-500 italic">Belum ada file dipilih</span>
				        <button type="button" onclick="triggerPickerFromModal()" class="px-2.5 py-1 bg-white border border-blue-200 text-blue-600 hover:bg-blue-100 rounded-lg text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-all shadow-sm">
				            <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i> Pilih dari Drive
				        </button>
				    </div>
				</div>

                <div class="pt-3 flex justify-end gap-2">
                    <button type="button" onclick="closeFormPelatihan()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 cursor-pointer">Batal</button>
                    <button type="submit" id="btn-submit-pelatihan" class="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 cursor-pointer flex items-center gap-1.5">
                        <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwqiivs1Re3C2dEdnK95Gy0Ast_ATdjdfTpXnYNyosBLZs5W6wl1EEgRna1AvJLqs2c/exec";
        let allEmployees = [];
        let currentFilter = 'ALL';
        let activePegawai = null;

        async function fetchEmployeeData() {
            try {
                const response = await fetch(API_URL);
                allEmployees = await response.json();
                
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('employee-grid').classList.remove('hidden');
                
                updateDashboardStats();
                renderEmployees();
            } catch (error) {
                console.error(error);
                document.getElementById('loading-state').innerHTML = `<p class="text-rose-500 font-medium text-xs">Gagal sinkronisasi data.</p>`;
            }
        }

        function updateDashboardStats() {
            document.getElementById('stat-total').innerText = allEmployees.length;
            document.getElementById('stat-asn').innerText = allEmployees.filter(p => p.STATUS === 'ASN').length;
            document.getElementById('stat-tt').innerText = allEmployees.filter(p => p.STATUS === 'JLOP / TT').length;
            document.getElementById('stat-p3').innerText = allEmployees.filter(p => p.STATUS === 'Pihak Ketiga').length;
        }

        function renderEmployees() {
            const grid = document.getElementById('employee-grid');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = allEmployees.filter(p => {
                const matchStatus = currentFilter === 'ALL' || p.STATUS === currentFilter;
                const matchSearch = (p.NAMA && p.NAMA.toLowerCase().includes(searchKeyword)) || 
                                    (p.JABATAN && p.JABATAN.toLowerCase().includes(searchKeyword)) ||
                                    (p.NIP_NIPPPK && p.NIP_NIPPPK.toString().includes(searchKeyword));
                return matchStatus && matchSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-400 text-xs py-12">Data pegawai tidak ditemukan.</div>`;
                return;
            }

            filtered.forEach(p => {
                let badgeColor = 'bg-purple-100 text-purple-700';
                if(p.STATUS === 'JLOP / TT') badgeColor = 'bg-amber-100 text-amber-700';
                if(p.STATUS === 'Pihak Ketiga') badgeColor = 'bg-rose-100 text-rose-700';

                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:shadow-md hover:border-blue-400 transition-all cursor-pointer flex flex-col justify-between';
                card.onclick = () => openModal(p);
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <span class="px-2.5 py-0.5 rounded-full text-[9px] font-bold ${badgeColor}">${p.STATUS}</span>
                            <span class="text-[10px] text-slate-400 font-mono">NO: ${p.NO || '—'}</span>
                        </div>
                        <h4 class="font-bold text-slate-900 text-sm line-clamp-1">${p.NAMA}</h4>
                        <p class="text-xs text-slate-500 mt-1 line-clamp-1"><i data-lucide="briefcase" class="w-3.5 h-3.5 inline mr-1 text-slate-400"></i>${p.JABATAN || '—'}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                        <span>${p.NIP_NIPPPK && p.NIP_NIPPPK !== '—' ? 'NIP: ' + p.NIP_NIPPPK.substring(0,8)+'...' : 'Non-NIP'}</span>
                        <span class="text-blue-600 font-semibold flex items-center gap-1 hover:underline text-[11px]">Detail <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(pegawai) {
            activePegawai = pegawai;
            const modal = document.getElementById('detail-modal');
            document.getElementById('modal-nama').innerText = pegawai.NAMA;
            document.getElementById('modal-jabatan').innerText = pegawai.JABATAN || '—';
            document.getElementById('modal-badge').innerText = pegawai.STATUS;
            
            const bodyContent = document.getElementById('modal-body-content');
            
            let detailsHtml = `
                <div class="grid grid-cols-2 gap-4 border-b border-slate-100 pb-3">
                    <div class="flex items-start gap-2.5">
                        <div class="text-slate-400 mt-0.5"><i data-lucide="credit-card" class="w-4 h-4"></i></div>
                        <div><p class="text-[10px] font-medium text-slate-400 uppercase">NIK KTP</p><p class="text-xs font-semibold text-slate-800">${pegawai.NIK}</p></div>
                    </div>
                    <div class="flex items-start gap-2.5">
                        <div class="text-slate-400 mt-0.5"><i data-lucide="hash" class="w-4 h-4"></i></div>
                        <div><p class="text-[10px] font-medium text-slate-400 uppercase">NPWP</p><p class="text-xs font-semibold text-slate-800">${pegawai.NPWP}</p></div>
                    </div>
                </div>
            `;

            if(pegawai.STATUS === 'ASN') {
                detailsHtml += `
                    <div class="flex items-start gap-2.5 border-b border-slate-100 pb-3">
                        <div class="text-slate-400 mt-0.5"><i data-lucide="binary" class="w-4 h-4"></i></div>
                        <div><p class="text-[10px] font-medium text-slate-400 uppercase">NIP / NIPPPK</p><p class="text-xs font-semibold text-slate-800">${pegawai.NIP_NIPPPK}</p></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 border-b border-slate-100 pb-3">
                        <div class="flex items-start gap-2.5">
                            <div class="text-slate-400 mt-0.5"><i data-lucide="award" class="w-4 h-4"></i></div>
                            <div><p class="text-[10px] font-medium text-slate-400 uppercase">Pangkat & Jenjang</p><p class="text-xs font-semibold text-slate-800">${pegawai.PANGKAT || '—'}</p><p class="text-[11px] text-slate-400 mt-0.5">${pegawai.JENJANG || ''}</p></div>
                        </div>
                        <div class="flex items-start gap-2.5">
                            <div class="text-slate-400 mt-0.5"><i data-lucide="layers" class="w-4 h-4"></i></div>
                            <div><p class="text-[10px] font-medium text-slate-400 uppercase">Golongan Ruang</p><p class="text-xs font-semibold text-slate-800">${pegawai.GOL_RUANG || '—'}</p></div>
                        </div>
                    </div>
                `;
            }

            // RIWAYAT PELATIHAN SECTION
            detailsHtml += `
                <div class="pt-2">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2">
                            <i data-lucide="graduation-cap" class="w-4 h-4 text-blue-600"></i>
                            <h4 class="text-xs font-bold text-slate-800 uppercase">Riwayat Pelatihan / Diklat</h4>
                        </div>
                        <button onclick="openFormPelatihan()" class="px-2.5 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-all">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah
                        </button>
                    </div>
            `;

            if(pegawai.PELATIHAN && pegawai.PELATIHAN.length > 0) {
                detailsHtml += `<div class="space-y-2">`;
                pegawai.PELATIHAN.forEach(item => {
                    detailsHtml += `
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/80 flex justify-between items-center gap-2">
                            <div>
                                <p class="text-xs font-bold text-slate-800">${item.NAMA_PELATIHAN}</p>
                                <p class="text-[11px] text-slate-500 mt-0.5">Penyelenggara: <span class="text-slate-700 font-medium">${item.PENYELENGGARA}</span> (${item.TAHUN})</p>
                                <p class="text-[10px] text-slate-400 font-mono mt-0.5">No. Sertifikat: ${item.NO_SERTIFIKAT}</p>
                            </div>
                            
                            <div>
                                ${item.URL_SERTIFIKAT ? 
                                    `<!-- JIKA SUDAH ADA SERTIFIKAT -->
                                     <a href="${item.URL_SERTIFIKAT}" target="_blank" class="px-3 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-lg text-[11px] font-semibold flex items-center gap-1 transition-all">
                                        <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Lihat
                                     </a>` 
                                    : 
                                    `<!-- JIKA BELUM ADA, PANGGAL POPUP GOOGLE DRIVE PICKER -->
                                     <button onclick="openDrivePicker('${pegawai.NIK}', '${item.NAMA_PELATIHAN}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-lg text-[11px] font-semibold flex items-center gap-1 cursor-pointer transition-all">
                                        <i data-lucide="upload" class="w-3.5 h-3.5"></i> Upload
                                     </button>`
                                }
                            </div>
                        </div>
                    `;
                });
                detailsHtml += `</div>`;
            } else {
                detailsHtml += `<p class="text-xs text-slate-400 italic bg-slate-50 p-3 rounded-xl border border-dashed border-slate-200 text-center">Belum ada data riwayat pelatihan.</p>`;
            }

            detailsHtml += `</div>`;

            bodyContent.innerHTML = detailsHtml;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

		function openFormPelatihan() {
		    if(!activePegawai) return;
		    tempDriveUrl = ""; // Reset
		    document.getElementById('file-status-text').innerText = "Belum ada file dipilih";
		    document.getElementById('file-status-text').classList.replace('text-emerald-600', 'text-slate-500');
		    
		    document.getElementById('input-nik').value = activePegawai.NIK;
		    document.getElementById('form-pelatihan').reset();
		    document.getElementById('form-pelatihan-modal').classList.remove('hidden');
		}

        function closeFormPelatihan() {
            document.getElementById('form-pelatihan-modal').classList.add('hidden');
        }

// Update fungsi Simpan di dalam modal
async function submitPelatihan(event) {
    event.preventDefault();
    const btnSubmit = document.getElementById('btn-submit-pelatihan');
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> Menyimpan...`;

    const payload = {
        "NIK": document.getElementById('input-nik').value,
        "NAMA_PELATIHAN": document.getElementById('input-nama-pelatihan').value,
        "TAHUN": document.getElementById('input-tahun').value,
        "PENYELENGGARA": document.getElementById('input-penyelenggara').value,
        "NO_SERTIFIKAT": document.getElementById('input-no-sertifikat').value || "—",
        "URL_SERTIFIKAT": tempDriveUrl // Kalau user pilih file, ini ada isinya. Kalau tidak, kosong.
    };

    await sendDataToScript(payload);
    
    // Reset setelah simpan
    tempDriveUrl = ""; 
    btnSubmit.disabled = false;
    btnSubmit.innerHTML = `<i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan`;
}

        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }
        
        function filterStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'active');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.target.classList.remove('bg-slate-100', 'text-slate-600');
            event.target.classList.add('bg-blue-600', 'text-white', 'active');
            renderEmployees();
        }

        document.getElementById('search-input').addEventListener('input', renderEmployees);
        window.onload = fetchEmployeeData;
		
		const API_KEY = 'AIzaSyDzjBCy1vYSM7Ku-4LZpvv6kJQxnTYiuFc';
		const CLIENT_ID = '822583215956-tf2nf9dk4u4jlfae11j6o4g8js0r67tn.apps.googleusercontent.com';
		const FOLDER_ID = '1TArKZuogbM_z1j1-rtiHOgHEen3Rv80a';

		let accessToken = null;
		let selectedNik = null;
		let selectedPelatihanName = null;
		let tempDriveUrl = ""; 

	function openDrivePicker(nik, namaPelatihan) {
    selectedNik = nik;
    selectedPelatihanName = namaPelatihan;
    
    // Pastikan gapi sudah siap
    if (typeof gapi === 'undefined') {
        alert("Pustaka Google API belum siap, silakan refresh halaman.");
        return;
    }

    if (!accessToken) {
        handleAuthClick();
    } else {
        // Muat pustaka picker terlebih dahulu sebelum dipanggil
        gapi.load('picker', createPicker);
    }
}

// FUNGSI 2: OTORISASI AKUN GOOGLE
function handleAuthClick() {
    const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (response) => {
            if (response.error !== undefined) {
                console.error("Auth error:", response);
                return;
            }
            accessToken = response.access_token;
            
            // Panggil gapi.load untuk memastikan google.picker tidak undefined
            gapi.load('picker', createPicker);
        },
    });
    tokenClient.requestAccessToken({ prompt: '' });
}

// FUNGSI 3: MEMBUAT DAN MENAMPILKAN JENDELA PICKER
function createPicker() {
    if (!accessToken) return;

    try {
        // Pastikan google.picker sudah terisi
        if (!google.picker) {
            gapi.load('picker', createPicker);
            return;
        }

        // 1. UPLOAD VIEW (Untuk upload file baru)
        const uploadView = new google.picker.DocsUploadView().setParent(FOLDER_ID);

        // 2. DRIVE SAYA VIEW (Untuk cari file di Drive user)
        const driveView = new google.picker.DocsView(google.picker.ViewId.DOCS)
            .setIncludeFolders(true)
            .setMimeTypes('application/pdf,image/png,image/jpeg'); // Biar user cuma lihat PDF/Gambar

        // 3. TERBARU VIEW (Mengganti RecentView yang error tadi)
        const recentView = new google.picker.DocsView(google.picker.ViewId.RECENTLY_PICKED);

        // 4. Gabungkan
        const picker = new google.picker.PickerBuilder()
            .addView(uploadView)
            .addView(driveView)
            .addView(recentView)
            .setOAuthToken(accessToken)
            .setDeveloperKey(API_KEY)
            .setCallback(pickerCallback)
            .setTitle("Sisipkan Sertifikat")
            .build();
            
        picker.setVisible(true);
    } catch (err) {
        console.error("Error Picker:", err);
        alert("Gagal memuat Google Drive Picker: " + err.message);
    }
}
		
// Pemicu dari dalam modal form
function triggerPickerFromModal() {
    // Kita panggil fungsi openDrivePicker, tapi dengan tanda khusus
    // Kita pakai variabel global 'tempDriveUrl' untuk menandakan kita lagi di form
    openDrivePicker(activePegawai.NIK, "FORM_MODAL");
}

// Perbaikan pickerCallback agar bisa membedakan konteks
async function pickerCallback(data) {
    if (data.action === google.picker.Action.PICKED) {
        const file = data.docs[0];
        const fileUrl = file.url;

        // CEK: Apakah kita sedang di dalam modal form?
        const isModalOpen = !document.getElementById('form-pelatihan-modal').classList.contains('hidden');

        if (isModalOpen) {
            // SKENARIO 1: Update UI saja, belum simpan ke database
            tempDriveUrl = fileUrl;
            document.getElementById('file-status-text').innerText = "File berhasil dipilih!";
            document.getElementById('file-status-text').classList.replace('text-slate-500', 'text-emerald-600');
            lucide.createIcons();
        } else {
            // SKENARIO 2 (Lama): Langsung update ke database via fetch
            const payload = {
                "NIK": selectedNik,
                "NAMA_PELATIHAN": selectedPelatihanName,
                "URL_SERTIFIKAT": fileUrl
            };
            await sendDataToScript(payload);
        }
    }
}

// Fungsi helper kirim data
async function sendDataToScript(payload) {
    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        alert("Data berhasil disimpan!");
        closeFormPelatihan();
        closeModal();
        fetchEmployeeData();
    } catch (err) {
        alert("Gagal menyimpan.");
        console.error(err);
    }
}
